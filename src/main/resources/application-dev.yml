# ==================== 开发环境配置 ====================
server:
  port: 9998

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/xc_management?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: qwer1234
    # 开发环境使用HikariCP连接池
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 600000
      connection-test-query: SELECT 1

  # 开发环境开启SQL日志输出
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

# 日志级别：开发环境设为DEBUG，便于调试
logging:
  level:
    root: debug
    com.xinchang.management: debug
    org.springframework.jdbc.core: debug

# Knife4j 接口文档：开发环境开启
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh-CN

# 应用上传路径
app:
  upload:
    base-path: ./uploads
