# ==================== 公共配置 ====================
# 服务器端口
server:
  port: 9998

# 文件上传限制
spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  profiles:
    active: dev

# 应用上传路径
app:
  upload:
    base-path: ./uploads

# sa-token 配置
sa-token:
  token-name: xc-token
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

# ==================== 环境激活 ====================

# ==================== Knife4j 接口文档 ====================
# 默认启用，通过各环境配置覆盖
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
